[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-tests"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "PyYAML>=6,<7", "jsonschema[format]>=4.23,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "unit: deterministic local tests",
  "skill_eval: behavior evaluations that require an Agent runtime",
  "integration: tests that require a disposable GitHub repository",
]
