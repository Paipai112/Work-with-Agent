# Native-host contract for the setup Skill. The same directory rules apply to
# github-collaboration; substitute that folder and invocation name when testing it.
# An observed installation is recorded separately with runtime version and path.
matrix:
  - agent: codex
    os: macos
    user_skill_path: ~/.agents/skills/github-collaboration-setup
    project_skill_path: .agents/skills/github-collaboration-setup
    entrypoint: SKILL.md
    explicit_invocation: $github-collaboration-setup
    daily_explicit_invocation: $github-collaboration
    new_session_required: true
    check_actual_discovery_path: true
    check_same_name_collision: true
    check_disabled_or_override: true
    official_skill_documentation: https://learn.chatgpt.com/docs/build-skills
